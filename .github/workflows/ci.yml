name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependency
        run: python -m pip install -U ddgs
      - name: Syntax-check the plugin and installer
        run: |
          node --check st-plugin/index.mjs
          node --check st-plugin/selfcheck.mjs
          python -m py_compile install.py local_search.py
      - name: Contract tests (offline, deterministic)
        run: python test_local_search.py
      - name: Contract tests against the real engines (informational; engines rate-limit CI runners)
        continue-on-error: true
        run: python test_local_search.py --live
